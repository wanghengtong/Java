server:
  port: 8080
  # 优雅停机配置：immediate/graceful
  shutdown: graceful

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 设置是否自动提交事务，默认为true
      auto-commit: true
      # 设置用于测试连接的SQL查询语句
      connection-test-query: SELECT 1
      # 设置获取数据库连接的超时时间，默认为30秒，单位是毫秒
      connection-timeout: 30000
      # 设置连接在连接池中保持空闲的最长时间，默认为10分钟，单位是毫秒
      idle-timeout: 30000
      # 设置连接在连接池中允许存在的最长时间，默认为30分钟，单位是毫秒
      max-lifetime: 1800000
      # 设置连接池中允许的最大连接数，默认为10
      maximum-pool-size: 15
      # 设置连接池中保持的最小空闲连接数，默认为10
      minimum-idle: 5
      # 设置连接池的名称，默认为"HikariPool-1"
      pool-name: agriculture
      # 设置连接验证的超时时间，默认为5秒，单位是秒
      validation-timeout: 5000
      # 设置连接
      keepalive: 300000

mybatis:
  #开启驼峰命名法
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  # xml地址
  mapper-locations: classpath:mapper/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.wanghengtong.framework.entity
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cache:
  type: local
  redis:
    host: localhost
    port: 6379
    pwd: 123
    database: 0
  local:
    period: 500L

log:
  file:
    # 日志文件保存总大小
    totalSizeCap: 2GB
    # 单个日志文件最大大小
    maxFileSize: 100MB
    # 日志文件保存天数
    maxHistory: 30
    # 日志文件保存路径
    path: /logs
  level:
    root: info
    org:
      springframework: error

async:
  executor:
    thread:
      # 核心线程数
      core_pool_size: 5
      # 最大线程数
      max_pool_size: 10
      # 线程队列大小
      queue_capacity: 10000
      # 线程存活时间
      keep_alive_seconds: 20
      # 线程名称前缀
      name_prefix: Executor-

license:
  subject: license
  publicAlias: publicCert
  storePass: public_password1234

# API签名配置
app:
  signature:
    # 签名开关
    enabled: false
    # 签名密钥
    secret-key: your_secret_key_here
    # 签名参数
    sign-param: sign
    # 时间戳参数
    timestamp-param: timestamp
    # 随机数参数
    nonce-param: nonce
    # 时间戳有效期
    timestamp-validity: 300000
    # 签名算法:MD5/HMAC-SHA256
    algorithm: md5
    # 需要校验签名的请求路径
    include-patterns:
      - /api/**
    # 不需要校验签名的请求路径
    exclude-params:
      - sign