server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 设置是否自动提交事务，默认为true
      auto-commit: true
      # 设置用于测试连接的SQL查询语句
      connection-test-query: SELECT 1
      # 设置获取数据库连接的超时时间，默认为30秒，单位是毫秒
      connection-timeout: 30000
      # 设置连接在连接池中保持空闲的最长时间，默认为10分钟，单位是毫秒
      idle-timeout: 30000
      # 设置连接在连接池中允许存在的最长时间，默认为30分钟，单位是毫秒
      max-lifetime: 1800000
      # 设置连接池中允许的最大连接数，默认为10
      maximum-pool-size: 15
      # 设置连接池中保持的最小空闲连接数，默认为10
      minimum-idle: 5
      # 设置连接池的名称，默认为"HikariPool-1"
      pool-name: agriculture
      # 设置连接验证的超时时间，默认为5秒，单位是秒
      validation-timeout: 5000
      # 设置连接
      keepalive: 300000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wanghengtong.threadpool.entity

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  file:
    totalSizeCap: 2GB
    maxHistory: 30
    maxSize: 1GB
    path: /log
  level:
    root: info
    org:
      springframework: error

async:
  executor:
    thread:
      core_pool_size: 5
      max_pool_size: 10
      queue_capacity: 10000
      keep_alive_seconds: 20
      name_prefix: Executor-